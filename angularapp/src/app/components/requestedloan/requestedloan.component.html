<app-adminnav></app-adminnav>

<!-- Animated Loading -->
<div *ngIf="isLoading" class="loading-wrapper">
  <app-loading-animation></app-loading-animation>
</div>

<!-- Main Content -->
<div *ngIf="!isLoading" class="requested-loan-container">
  <h2>Requested Loans</h2>

  <!-- Filters Container -->
  <div class="filters-container">
    <!-- Global Search -->
    <input
      type="text"
      class="search-input"
      placeholder="Search anything"
      (input)="onQuickFilterChanged($event)"
    />

    <!-- Status Filter Dropdown -->
    <select [(ngModel)]="selectedStatus" (change)="applyStatusFilter()" class="status-filter">
      <option value="">All Status</option>
      <option value="0">Pending</option>
      <option value="1">Approved</option>
      <option value="2">Rejected</option>
    </select>
  </div>

  <!-- Ag-Grid -->
  <ag-grid-angular
    style="width: 100%; height: 500px;"
    class="ag-theme-alpine"
    [rowData]="loanApplications"
    [columnDefs]="columnDefs"
    [defaultColDef]="defaultColDef"
    [quickFilterText]="quickFilterText"
    pagination="true"
    [paginationPageSize]="10"
    (gridReady)="onGridReady($event)"
    (cellClicked)="onCellClicked($event)">
  </ag-grid-angular>

  <!-- Modal -->
  <div class="modal" *ngIf="showModal">
    <div class="modal-content">
      <span class="close" (click)="closeModal()">×</span>
      <h3>Additional Details</h3>
      <p><strong>Farmer Address:</strong> {{ selectedApplication?.FarmerAddress }}</p>
      <p><strong>Farm Location:</strong> {{ selectedApplication?.FarmLocation }}</p>
      <p><strong>Farm Size (Acres):</strong> {{ selectedApplication?.FarmSizeInAcres }}</p>
      <p><strong>Submission Date:</strong> {{ selectedApplication?.SubmissionDate }}</p>
      <p><strong>Uploaded File:</strong></p>
      <img [src]="selectedApplication?.File" alt="Uploaded Proof" width="300" />
    </div>
  </div>
</div>
