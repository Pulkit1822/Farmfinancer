<div 
  class="grid-background" 
  [class.fade-effect]="fadeEffect"
  [class.subtle]="intensity === 'subtle'"
  [class.moderate]="intensity === 'moderate'"
  [class.visible]="intensity === 'visible'"
  [class.strong]="intensity === 'strong'"
  [class.dotted]="intensity === 'dotted'"
  [style.background-size.px]="gridSize + ' ' + gridSize">
</div>
