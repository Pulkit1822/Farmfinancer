<div class="faq-accordion">
    <div class="faq-item" *ngFor="let item of faqItems; let i = index" [class.open]="item.isOpen">
      <div class="faq-header" (click)="toggleItem(i)">
        <h3 class="faq-title">{{ item.title }}</h3>
        <div class="faq-icon" [class.rotated]="item.isOpen">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="m6 9 6 6 6-6"/>
          </svg>
        </div>
      </div>
      <div class="faq-content" [class.expanded]="item.isOpen">
        <div class="faq-content-inner">
          <p>{{ item.content }}</p>
        </div>
      </div>
    </div>
  </div>
