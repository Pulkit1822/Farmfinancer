  <app-usernav></app-usernav>

  <!-- Animated Loading -->
  <div *ngIf="isLoading" class="loading-wrapper">
    <app-loading-animation></app-loading-animation>
  </div>
  
  <!-- Main Content -->
  <div *ngIf="!isLoading" class="applied-loan-container">
    <h2>My Applied Loans</h2>
    
    <div class="search-container">
      <input
        type="text"
        class="search-input"
        placeholder="Search by Farm Purpose"
        [(ngModel)]="searchText"
        (input)="filterLoans()"
      />
    </div>
  
    <div *ngIf="filteredApplications.length === 0" class="no-records">
      No records found
    </div>
  
    <ag-grid-angular
      *ngIf="filteredApplications.length > 0"
      style="width: 100%; height: 500px;"
      class="ag-theme-alpine"
      [rowData]="filteredApplications"
      [columnDefs]="columnDefs"
      [defaultColDef]="defaultColDef"
      pagination="true"
      [paginationPageSize]="10"
      (gridReady)="onGridReady($event)"
      (cellClicked)="onCellClicked($event)">
    </ag-grid-angular>
  
    <div class="modal" *ngIf="showModal">
      <div class="modal-content">
        <p>Are you sure you want to delete this loan application?</p>
        <button (click)="deleteLoan()">Yes, Delete</button>
        <button (click)="closeModal()">Cancel</button>
      </div>
    </div>
  </div>
