<div class="error-background">
  <app-letter-glitch 
    [glitchSpeed]="50"
    [centerVignette]="true"
    [outerVignette]="false"
    [smooth]="true"
    [glitchColors]="['#dc3545', '#ff6b6b', '#ff8787']">
  </app-letter-glitch>
</div>

<div class="error-container">
  <h1>404</h1>
  <h2>Page Not Found</h2>
  <a routerLink="/">Return to Home</a>
</div>
