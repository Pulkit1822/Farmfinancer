<app-usernav></app-usernav>
<div class="container">
  <h1>My Submitted Feedback</h1>
  
  <!-- Loading Animation -->
  <div *ngIf="isLoading" class="loading-wrapper">
    <app-loading-animation></app-loading-animation>
  </div>
 
  <div *ngIf="!isLoading">
    <div class="header">
      <div class="header-spacer"></div>
      <button class="btn-add" (click)="goToPostFeedback()">
        + Add New Feedback
      </button>
    </div>

    <div *ngIf="feedbacks.length === 0" class="info">
      <p>You have not submitted any feedback yet.</p>
      <p>Click "Add New Feedback" to share your thoughts!</p>
    </div>
 
    <table *ngIf="feedbacks.length > 0" class="feedback-table">
      <thead>
        <tr>
          <th>S.No</th>
          <th>Feedback</th>
          <th>Time Posted</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let feedback of feedbacks; let i = index">
          <td>{{ i + 1 }}</td>
          <td class="feedback-text">{{ feedback.FeedbackText }}</td>
          <td>{{ feedback.Date | date:'medium' }}</td>
          <td class="action-cell">
            <button class="btn-delete" (click)="showDeleteConfirmation(feedback.FeedbackId)">Delete</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
