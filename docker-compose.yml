version: '3.8'

services:
  database:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: farmfinancer_db
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=examlyMssql@123
      - MSSQL_PID=Developer
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    networks:
      - farmfinancer_net
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'examlyMssql@123' -C -Q 'SELECT 1' || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P 'examlyMssql@123' -Q 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: dotnetapp/Dockerfile
    container_name: farmfinancer_api
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__con=Server=database,1433;Database=appdb;User Id=sa;Password=examlyMssql@123;TrustServerCertificate=true;Encrypt=false
      - Cors__AllowedOrigins__0=http://localhost:4200
      - Cors__AllowedOrigins__1=http://localhost:8081
      - EnableSwagger=true
    ports:
      - "8080:8080"
    depends_on:
      database:
        condition: service_healthy
    networks:
      - farmfinancer_net

volumes:
  sqlserver_data:

networks:
  farmfinancer_net:
    driver: bridge
